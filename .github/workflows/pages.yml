name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v4/app/package-lock.json

      - name: Install app toolchain
        run: npm --prefix v4/app ci

      - name: Build static package (relative base)
        run: npm --prefix v4/app run build

      - name: Stage release/neurou
        run: |
          rm -rf release/neurou
          mkdir -p release/neurou
          cp -R v4/app/dist/. release/neurou/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/neurou

      - id: deployment
        uses: actions/deploy-pages@v4
