name: Feature request
description: 提议一个可验收的功能或架构变更
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明它落在 core / adapters / app / Rust 的哪一层
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 冻结边界影响
      description: 是否会改 R4a.1 / AudioOutputClock / ChartPremiereDirector / 账本 / AI proposal-only？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: 单元测试 / e2e / 手动路径 / 失败路径
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
