services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: neurou_admin
      POSTGRES_DB: neurou_auth
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set private POSTGRES_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - neurou_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurou_admin -d neurou_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  neurou_auth_data:
