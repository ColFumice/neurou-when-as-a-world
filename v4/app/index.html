<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <title>neurou : when as a world</title>
    <script>
      // R5c-B debug 入口：在 Vite/App 模块加载前捕获 query，避免 Tauri 导航重置。
      try {
        if (new URLSearchParams(window.location.search).get('mode') === 'rhythm') {
          window.sessionStorage.setItem('neurou.game.mode', 'rhythm');
        }
      } catch (_) {
        // sessionStorage may be unavailable in hardened WebViews.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
